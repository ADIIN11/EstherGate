<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_Up</title>
    <link rel="stylesheet" href="/Sign_Up.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>
<body>
    <header>
        <img src="/assets/logo-notext.png" alt="" height="200px">
        <h1>ESTHER GATE</h1>
    </header>
       
        <div class="Form">
            <form id="form-id" >
                <h2>Sign-Up</h2>
                <br>
                <input type="text" placeholder="Username" id="username-inpt">
                <br>
                <input type="text" placeholder="Email" id="email-inpt">
                <br>
                <input type="password" placeholder="password" id="password-inpt">
                <br>
                <input type="text" placeholder="confirm password" id="cnfm-password-inpt">
                <br>
                <img src="" alt="captcha">
                <br>
                <input class="captcha-input" type="text" placeholder="captcha" id="captcha-inpt">
                <button type="reset" onclick="" class="captcha-btn">
                    <img src="/assets/reload-icon.png" alt="icon"  class="reload-icon" >
                </button>
                <br>
                <button type="submit" class="form-btn">Submit</button>
                <h4 class="form-text">------or------</h4>
                <button type="button" class="form-btn" onclick="window.location.href='/Auth/Sign_In';" >Sign-In</button>
                <p id="msg-id" class="msg-para"></p>

            </form> 
        </div>

        <script src="/Sign_Up.js"></script>
</body>
</html>
