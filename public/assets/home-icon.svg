<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#fef4bc" />

  <!-- Roof with rounded joins -->
  <polygon points="20,45 50,20 80,45" fill="none" stroke="#ef720a" stroke-width="4" stroke-linejoin="round" />

  <!-- House body with rounded corners -->
  <rect x="30" y="45" width="40" height="30" fill="none" stroke="#ef720a" stroke-width="4" />

  <!-- Door with rounded corners -->
  <rect x="45" y="55" width="10" height="20" fill="none" stroke="#ef720a" stroke-width="3" rx="3" ry="3" />
</svg>
