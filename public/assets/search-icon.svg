<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --lemon-chiffon: #fef4bc;
      --harvest-orange: #ef720a;
    }
  </style>
  <!-- Background -->
  <rect width="100" height="100" fill="var(--lemon-chiffon)" />
  
  <!-- Magnifying glass circle (centered, bigger) -->
  <circle cx="50" cy="50" r="25" stroke="var(--harvest-orange)" stroke-width="6" fill="none" />
  
  <!-- Handle (starts just outside circle edge, thicker for sturdiness) -->
  <line x1="68" y1="68" x2="82" y2="82" stroke="var(--harvest-orange)" stroke-width="8" stroke-linecap="round" />
</svg>
