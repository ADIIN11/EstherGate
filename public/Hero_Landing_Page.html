<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esther Gate</title>
    <style>
        :root {
            --spicy-paprika: #e35311;
            --golden-orange: #f3a000;
            --harvest-orange: #ef720a;
            --amber-flame: #feb60b;
            --lemon-chiffon: #fef4bc;
            
            --scroll: 0;
            
            /* --- TIMELINES --- */
            --m1-prog: clamp(0, calc(var(--scroll) * 5), 1);
            --m2-prog: clamp(0, calc((var(--scroll) - 0.10) * 3.33), 1);
            --c-prog: clamp(0, calc((var(--scroll) - 0.40) / 0.60), 1);
            --m3-prog: clamp(0, calc((var(--scroll) - 0.30) * 3.33), 1);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--lemon-chiffon);
            font-family: 'Arial Black', Impact, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        body { height: 600vh; }

        #scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--lemon-chiffon);
        }

        #logo-layer {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        #logo-text {
            white-space: nowrap;
            font-size: clamp(3rem, 8vw, 6.5rem);
            color: var(--spicy-paprika);
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: calc(var(--scroll) * var(--scroll) * var(--scroll)); 
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { filter: drop-shadow(0 0 5px var(--golden-orange)); }
            to { filter: drop-shadow(0 0 20px var(--golden-orange)); }
        }

        .landscape-layer {
            position: absolute;
            bottom: 22vh; 
            left: -25vw; 
            width: 150vw; 
            height: 50vh;
            transform-origin: bottom center;
        }

        #landscape-back {
            z-index: 2;
            transform: translateY(calc((1 - var(--m1-prog)) * 100%)) scale(calc(0.5 + 0.5 * var(--m1-prog)));
            opacity: calc(var(--m1-prog) * 1.5);
        }

        #landscape-mid {
            z-index: 3;
            transform: translateY(calc((1 - var(--m2-prog)) * 100%)) scale(calc(0.6 + 0.4 * var(--m2-prog)));
            opacity: calc(var(--m2-prog) * 1.5);
        }

        #landscape-front {
            z-index: 4;
            transform: translateY(calc((1 - var(--m3-prog)) * 100%)) scale(calc(0.7 + 0.3 * var(--m3-prog)));
            opacity: calc(var(--m3-prog) * 1.5);
        }

        /* Castle Fix: Lowered by a few extra pixels */
        #castle-layer {
            position: absolute;
            bottom: calc(22vh - 5px); 
            left: 50%;
            width: 100vw; 
            height: 75vh; 
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
        }

        #castle-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            transform: translateY(calc((1 - var(--c-prog)) * 100%)) scale(calc(0.05 + (0.95 * var(--c-prog))));
            width: 100vw;
        }

        /* Castle Fix: Display block removes inline descent gap causing levitation */
        #castle-group svg {
            display: block; 
        }

        #ground-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 22vh; 
            background-color: var(--harvest-orange);
            z-index: 10;
        }

        #path {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100%;
            background-color: var(--amber-flame);
            clip-path: polygon(45% 0%, 55% 0%, 90% 100%, 10% 100%);
        }

        #flora-layer {
            position: absolute;
            bottom: 22vh; 
            width: 100vw;
            height: 78vh;
            z-index: 20;
            pointer-events: none;
            opacity: clamp(0, calc((0.95 - var(--scroll)) * 20), 1);
        }

        .flora-container {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            will-change: transform, left, opacity;
        }

        #path-leaves-layer {
            position: absolute;
            bottom: 22vh; 
            width: 100vw;
            height: 78vh;
            z-index: 21;
            pointer-events: none;
            opacity: clamp(0, calc((0.95 - var(--scroll)) * 20), 1);
        }

        #ui-layer {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
            z-index: 200;
            opacity: calc((var(--c-prog) - 0.95) * 20);
            /* Error Fix: Default pointer-events to none. Toggled via JS. */
            pointer-events: none;
        }

        #signup-btn {
            padding: 15px 45px;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--lemon-chiffon);
            background-color: var(--spicy-paprika);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            animation: btnGlow 2s ease-in-out infinite alternate;
        }

        @keyframes btnGlow {
            from { box-shadow: 0 0 10px var(--golden-orange); }
            to { box-shadow: 0 0 30px var(--golden-orange); }
        }

        #signup-btn:hover {
            background-color: var(--harvest-orange);
            transform: translateY(-5px) scale(1.05);
        }

        #leaves-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 300;
            pointer-events: none;
        }
    </style>
</head>

        <div id="ground-layer">
            <div id="path"></div>

        <div id="flora-layer"></div>

        <div id="ui-layer">
            <button id="signup-btn" onclick="window.location.href='/Home'">Enter the Gate</button>

    <script>
        // Error Fix: Target the UI layer to handle pointer events safely via JS
        const uiLayer = document.getElementById('ui-layer');
        let currentScrollProgress = 0;

        window.addEventListener('scroll', () => {
            let maxScroll = document.body.scrollHeight - window.innerHeight;
            currentScrollProgress = Math.min(window.scrollY / maxScroll, 1);
            document.documentElement.style.setProperty('--scroll', currentScrollProgress);
            updateFloraPerspective();

            // Error Fix: Switch to 'auto' only when animation is done
            uiLayer.style.pointerEvents = currentScrollProgress > 0.95 ? 'auto' : 'none';
        });

        // --- DYNAMIC FLORA GENERATION ---
        const floraLayer = document.getElementById('flora-layer');
        const pathLeavesLayer = document.getElementById('path-leaves-layer');
        
        const floraObjects = [];
        const pathLeafObjects = [];
        
        const numPairs = 120; 
        const numPathLeaves = 20;
        const scrollDistanceMultiplier = 4.0; 
        
        const leafColors = ['#e35311', '#f3a000', '#ef720a', '#feb60b'];
        const bushGrassColors = ['#e35311', '#f3a000', '#feb60b'];

        const svgs = {
            tree: (color) => `
                <svg viewBox="0 0 200 300" width="250px" height="375px" preserveAspectRatio="xMidYMax meet">
                    <path d="M 90 300 L 110 300 L 105 100 L 95 100 Z" fill="var(--spicy-paprika)" />
                    <polyline points="100,200 60,110" stroke="var(--spicy-paprika)" stroke-width="8" stroke-linecap="round" fill="none"/>
                    <polyline points="100,140 135,70" stroke="var(--spicy-paprika)" stroke-width="8" stroke-linecap="round" fill="none"/>
                    <path d="M 50 180 C 15 170 10 110 40 90 C 30 40 80 10 110 25 C 140 -5 190 20 180 70 C 215 90 205 160 160 170 C 150 220 90 235 70 200 Z" fill="${color}" />
                </svg>`,
            bush: (color) => `
                <svg viewBox="0 0 200 150" width="150px" height="112px" preserveAspectRatio="xMidYMax meet">
                    <path d="M 20 140 C 0 140 0 90 40 70 C 30 20 80 0 110 20 C 140 -10 190 10 180 60 C 215 80 205 130 160 140 Z" fill="${color}" />
                </svg>`,
            grass: (color) => `
                <svg viewBox="0 0 100 100" width="60px" height="60px" preserveAspectRatio="xMidYMax meet">
                    <path d="M 50 100 Q 40 60 20 30 Q 45 70 50 100 M 50 100 Q 55 50 60 10 Q 65 60 50 100 M 50 100 Q 70 70 90 40 Q 65 80 50 100" fill="${color}" />
                </svg>`,
            grassClump: (color) => `
                <svg viewBox="0 0 150 100" width="90px" height="60px" preserveAspectRatio="xMidYMax meet">
                    <g transform="translate(0, 20) scale(0.8)">
                        <path d="M 50 100 Q 40 60 20 30 Q 45 70 50 100 M 50 100 Q 55 50 60 10 Q 65 60 50 100 M 50 100 Q 70 70 90 40 Q 65 80 50 100" fill="${color}" />
                    </g>
                    <g transform="translate(25, 0) scale(1)">
                        <path d="M 50 100 Q 40 60 20 30 Q 45 70 50 100 M 50 100 Q 55 50 60 10 Q 65 60 50 100 M 50 100 Q 70 70 90 40 Q 65 80 50 100" fill="${color}" />
                    </g>
                    <g transform="translate(65, 30) scale(0.7)">
                        <path d="M 50 100 Q 40 60 20 30 Q 45 70 50 100 M 50 100 Q 55 50 60 10 Q 65 60 50 100 M 50 100 Q 70 70 90 40 Q 65 80 50 100" fill="${color}" />
                    </g>
                </svg>`,
            pathLeaf: (color) => `
                <svg viewBox="0 0 100 100" width="40px" height="40px" preserveAspectRatio="xMidYMax meet">
                    <path d="M 50,5 C 80,30 95,60 50,95 C 5,60 20,30 50,5 Z" fill="${color}" />
                </svg>`
        };

        for (let i = 0; i < numPairs; i++) {
            let baseZ = 0.02 + (i * (scrollDistanceMultiplier / numPairs));
            
            ['left', 'right'].forEach(side => {
                let rand = Math.random();
                let type;
                
                if (rand < 0.25) type = 'tree';
                else if (rand < 0.40) type = 'bush';
                else if (rand < 0.80) type = 'grass';
                else type = 'grassClump';
                
                let color = type === 'tree' 
                    ? leafColors[Math.floor(Math.random() * leafColors.length)]
                    : bushGrassColors[Math.floor(Math.random() * bushGrassColors.length)];
                
                let minOffset = type === 'tree' ? 8 : 4; 
                let randomOffset = (Math.random() * 15); 

                let el = document.createElement('div');
                el.className = 'flora-container';
                el.innerHTML = svgs[type](color);
                floraLayer.appendChild(el);
                
                floraObjects.push({ 
                    el: el, side: side, z: baseZ, offset: minOffset + randomOffset, type: type 
                });
            });
        }

        for (let i = 0; i < numPathLeaves; i++) {
            let baseZ = 0.05 + (i * (scrollDistanceMultiplier / numPathLeaves));
            let color = leafColors[Math.floor(Math.random() * leafColors.length)];
            let xOffset = (Math.random() - 0.5) * 6; 
            let hitGroundZ = 0.1 + Math.random() * 0.3; 
            let baseRotation = Math.random() * 360;

            let el = document.createElement('div');
            el.className = 'flora-container';
            el.innerHTML = svgs.pathLeaf(color);
            pathLeavesLayer.appendChild(el);

            pathLeafObjects.push({ 
                el: el, z: baseZ, xOffset: xOffset, hitGroundZ: hitGroundZ, baseRotation: baseRotation 
            });
        }

        function updateFloraPerspective() {
            floraObjects.forEach(item => {
                let currentZ = item.z - (currentScrollProgress * scrollDistanceMultiplier);
                
                if (currentZ < 1 && currentZ > -0.1) {
                    let invZ = 1 - currentZ; 
                    
                    let baseScale = item.type === 'tree' ? 4.0 : (item.type === 'bush' ? 1.5 : (item.type === 'grassClump' ? 1.4 : 1.2));
                    let scale = 0.05 + Math.pow(invZ, 2.5) * baseScale; 
                    
                    let xOffsetPercent = item.offset + Math.pow(invZ, 1.2) * 35; 
                    let xPos = item.side === 'left' 
                        ? `calc(50vw - ${xOffsetPercent}vw)` 
                        : `calc(50vw + ${xOffsetPercent}vw)`;

                    let yOffsetVH = Math.pow(invZ, 1.2) * 22; 

                    let opacity = 1;
                    if (invZ > 0.8) opacity = 1 - ((invZ - 0.8) * 5); 

                    if (opacity <= 0) {
                        item.el.style.display = 'none';
                    } else {
                        item.el.style.display = 'block';
                        item.el.style.opacity = opacity;
                        item.el.style.transform = `translateX(-50%) translateY(${yOffsetVH}vh) scale(${scale})`;
                        item.el.style.left = xPos;
                        item.el.style.zIndex = Math.floor(invZ * 100); 
                    }
                } else {
                    item.el.style.display = 'none';
                }
            });

            pathLeafObjects.forEach(item => {
                let currentZ = item.z - (currentScrollProgress * scrollDistanceMultiplier);
                if (currentZ < 1 && currentZ > -0.1) {
                    let invZ = 1 - currentZ; 
                    let scale = 0.05 + Math.pow(invZ, 2.5) * 0.8; 
                    let xPos = `calc(50vw + ${item.xOffset * (1 + Math.pow(invZ, 1.5) * 10)}vw)`;

                    let yOffsetVH = Math.pow(invZ, 1.2) * 22; 
                    let fallOffsetVH = 0;
                    let currentRotation = item.baseRotation;

                    if (invZ < item.hitGroundZ) {
                        let fallProgress = Math.max(0, invZ / item.hitGroundZ);
                        fallOffsetVH = -40 * (1 - Math.pow(fallProgress, 2)); 
                        currentRotation += (invZ * 1500);
                    }

                    let finalY = yOffsetVH + fallOffsetVH;

                    let opacity = 1;
                    if (invZ < 0.05) opacity = invZ * 20; 
                    else if (invZ > 0.85) opacity = 1 - ((invZ - 0.85) * 6.6); 

                    if (opacity <= 0) {
                        item.el.style.display = 'none';
                    } else {
                        item.el.style.display = 'block';
                        item.el.style.opacity = opacity;
                        item.el.style.transform = `translateX(-50%) translateY(${finalY}vh) scale(${scale}) rotate(${currentRotation}deg)`;
                        item.el.style.left = xPos;
                        item.el.style.zIndex = Math.floor(invZ * 100); 
                    }
                } else {
                    item.el.style.display = 'none';
                }
            });
        }
        updateFloraPerspective();

        // --- 2D CANVAS LEAF PHYSICS ---
        const canvas = document.getElementById('leaves-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Leaf {
            constructor() { this.reset(true); }

            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -50;
                this.size = Math.random() * 15 + 10;
                this.color = leafColors[Math.floor(Math.random() * leafColors.length)];
                this.baseVy = Math.random() * 1.5 + 1.5; 
                this.vy = this.baseVy; 
                this.baseVx = (Math.random() - 0.5) * 1.5; 
                this.vx = this.baseVx; 
                this.angle = Math.random() * 360;
                this.baseSpin = (Math.random() - 0.5) * 3;
                this.spin = this.baseSpin;
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;
                this.angle += this.spin;
                this.vx = this.vx * 0.985 + this.baseVx * 0.015; 
                this.vy = this.vy * 0.95 + this.baseVy * 0.05; 
                this.spin = this.spin * 0.98 + this.baseSpin * 0.02; 

                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 180) {
                    const force = (180 - distance) / 180;
                    this.vx += (dx / distance) * force * 0.25; 
                    this.vy -= force * 0.4; 
                    this.spin += (dx / distance) * force * 2;
                }

                if (this.y > canvas.height + 50) this.reset(false);
                if (this.x < -100) this.x = canvas.width + 50;
                if (this.x > canvas.width + 100) this.x = -50;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.angle * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const leaves = [];
        for (let i = 0; i < 45; i++) leaves.push(new Leaf());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            leaves.forEach(leaf => leaf.update());
            leaves.forEach(leaf => leaf.draw());
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
