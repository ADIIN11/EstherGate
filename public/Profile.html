<!DOCTYPE html>

<head>

    <title>Index</title>
    <link rel="stylesheet" href="/Profile.css">

</head>

<div class="search-bar">
    
    <div class="side-bar">

        <br>
        <button class="tab-btn" id="tab-btn" type="button" aria-label="Toggle menu">

                <rect width="100" height="100" fill="#fef4bc" /> 
                <line class="bar" x1="20" y1="30" x2="80" y2="30" stroke="#ef720a" stroke-width="8" stroke-linecap="round" /> 
                <line class="bar" x1="20" y1="50" x2="80" y2="50" stroke="#ef720a" stroke-width="8" stroke-linecap="round" /> 
                <line class="bar" x1="20" y1="70" x2="80" y2="70" stroke="#ef720a" stroke-width="8" stroke-linecap="round" />
            </svg>
        </button>

        <ul>
            <li class="sidebar-li">
                <div class="super-li">
                <a href='/Home' class="sidebar-anchors icon">
                    <img src="/assets/home-icon.svg" alt="home-icon" class="sidebar-icon">
                </a>
                <a href='/Home' class="sidebar-anchors">Home</a>
                </div>
                <div class="sub-li">
                    <a href="Home/Best_Sellers.html" class="sidebar-anchors sub">Best Sellers</a>
                    <a href="Home/Categories.html" class="sidebar-anchors sub">Categories</a>
                </div>
            </li>
            
            <li class="sidebar-li">
                <div class="super-li" id="profile-icon">
                 <a href="/Auth/Sign_In" class="sidebar-anchors icon">
                        <img src="/assets/profile-icon.svg" alt="profile-icon" class="sidebar-icon">
                 </a>
                <a href="/Auth/Sign_In" class="sidebar-anchors" id="sidebar-profile-text">Profile</a>
                </div>
                <div class="sub-li" id="profile-sub-li"> 
                    <a href="/Auth/Sign_Up" class="sidebar-anchors sub">Sign-Up</a>
                    <a href="/Auth/Sign_In" class="sidebar-anchors sub">Sign-In</a>
                </div>
            </li>

            <li class="sidebar-li" id="list-product-li">
                <div class="super-li">
                    <a href="/Auth/Sign_In" class="sidebar-anchors icon">
                        <img src="/assets/list-item-icon.svg" alt="list-item-icon" class="sidebar-icon">
                    </a>
                <a href="/Auth/Sign_In" class="sidebar-anchors">List Product</a>
                </div>
            </li>
            
            <li class="sidebar-li">
                <div class="super-li">
                     <a href="Track_Order.html" class="sidebar-anchors icon">
                         <img src="/assets/track-order-icon.svg" alt="track-order-icon" class="sidebar-icon">
                     </a>
                <a href="Track_Order.html" class="sidebar-anchors">Track Order</a>
                </div>
            </li>
            
            <li class="sidebar-li">
                 <div class="super-li">
                     <a href="Help.html" class="sidebar-anchors icon">
                        <img src="/assets/help-icon.svg" alt="help-icon" class="sidebar-icon">
                     </a>
                <a href="Help.html" class="sidebar-anchors">Help</a>
                </div>
            </li>
            
            <li class="sidebar-li">
                <div class="super-li">
                      <a href="about.html" class="sidebar-anchors icon">
                        <img src="/assets/about-icon.svg" alt="about-icon" class="sidebar-icon">
                      </a>
                <a href="about.html" class="sidebar-anchors">about</a>
                </div>
            </li>
        </ul>
    </div>
    
    <!-- === NEW SEARCH WRAPPER START === -->
    <div class="input-wrapper">
        <input class="search-inpt" id="search-inpt" type="text" placeholder="Search" autocomplete="off">
        <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
    </div>
    <!-- === NEW SEARCH WRAPPER END === -->

    <button class="search-btn" id="search-button" type="button"> 
        <img src="/assets/search-icon.svg" alt="icon" class="search-icon" >
    </button>
    
    <button class="cart-btn" id="cart-button" type="button" onclick="cartPage()"> 
        <img src="/assets/cart-icon.svg" alt="cart" class="cart-icon" >
        <span class="cart-badge" id="cart-badge"></span>
    </button>

     <div class="filter-bar">
        <!-- Your filter code stays the same -->
        <form class="filter-form" action="" method="post">
            <select title="filter" class="filter" id="filter" name="filter"> 
                <option value="0" disabled selected>Filter</option> 
                <optgroup label="Electronics">
                    <option value="Mobiles">Mobiles</option> 
                    <option value="Laptop">Laptop</option>
                </optgroup>
                <optgroup label="Clothes">
                    <option value="Jeans">Jeans</option> 
                </optgroup>
            </select>
            
            <select title="sort" class="Sort" id="sort" name="sort"> 
                <option value="0" disabled selected>Sort</option> 
                <option value="1">A-Z</option> 
                <option value="2">Z-A</option> 
                <option value="3">Low to High</option> 
                <option value="4">High to Low</option> 
                <option value="5">None</option> 
            </select>
        </form>
    </div>
</div>

     <div class="content">
     <div class="profile">
        <div class="profile-img-holder" id="profile-img-holder">
            <img src="/assets/profile-icon.svg" alt="profile-icon" class="content-profile-img">
        </div>


        <div class="profile-datails" id="profile-details">
                <h2 class="profile-username">Username</h2>
                <h3 class="profile-email">Email@email.com</h2>
                <div class="verification-box">
                    <img src="/assets/attention-icon.svg" alt="attention-icon" class="verification-icon">
                    <h4 class="profile-verification">"Account Not Verified"</h1>
                </div>
                <div class="verification-box">
                    <img src="/assets/attention-icon.svg" alt="attention-icon" class="verification-icon">
                    <h4 class="profile-verification">"Seller Not Verified"</h1>
                </div>
                
            
        </div>
     </div>

        <div class="content-ul">

        <div class="content-li verification" id="content-li-verification" onclick="window.location.href='/Verify_Account';" >
            <a href="/Verify_Account" class="content-anchors">Verify Account</a>
        </div>

        <div class="content-li" onclick="window.location.href='/Profile/Edit_Profile';">
            <a href="/Profile/Edit_Profile" class="content-anchors">Edit Profile</a>
        </div>
         <div class="content-li">
            <a href="#" onclick="cartPage()" class="content-anchors">My Cart</a>
        </div>
        <div class="content-li">
            <a href="" class="content-anchors">My Orders</a>
        </div>
        <div class="content-li">
            <a href="" class="content-anchors">My Listed Products</a>
        </div>
        <div class="content-li">
            <a href="" class="content-anchors">Change Password</a>
        </div>
        <div class="content-li">
            <a href="" class="content-anchors">Delete Acccount</a>
        </div>
        <div class="content-li" onclick="signOut()">
            <a href="#" onclick="event.preventDefault(); signOut();" class="content-anchors">Sign Out</a>
        </div>

        </div>
        


    </div>  

    <script src="/Profile.js"></script>

</html>
